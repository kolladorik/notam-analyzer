<style>

  /* ── Layout ── */

  /* ── Disclaimer ── */

  .disclaimer-body { color: #3a6a3a; font-size: 11px; line-height: 1.6; font-family: var(--sans); }
  .btn-dismiss { background: none; border: none; color: #2a5a2a; cursor: pointer; font-size: 16px; padding: 0; flex-shrink: 0; }

  /* ── API Key panel ── */
  .api-panel {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 20px; margin-bottom: 16px;

  .field-label { color: var(--text3); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 6px; }
  .api-key-row { display: flex; gap: 8px; align-items: center; }
  .api-key-input {
    flex: 1; background: var(--bg4); border: 1px solid var(--border2);

  .api-key-input:focus { border-color: var(--accent); }

  .api-key-hint a { color: var(--text3); }

  /* ── Input panel ── */
  .input-panel {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; margin-bottom: 16px;
  }
  .last-briefing-row { margin-bottom: 16px; }
  .datetime-input {
    background: var(--bg4); border: 1px solid var(--border2);
    border-radius: 4px; padding: 8px 12px; color: var(--text);
    font-size: 12px; font-family: var(--mono); outline: none; width: 280px;
    color-scheme: dark;
  }
  .datetime-input:focus { border-color: var(--accent); }

  /* Mode tabs */
  .mode-tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .mode-tab {
    background: transparent; border: 1px solid #0d1a2a; color: var(--text4);
    border-radius: 4px; padding: 6px 16px; cursor: pointer;
    font-size: 11px; letter-spacing: 1px; font-family: var(--mono); transition: all 0.2s;
  }
  .mode-tab.active { background: #0d1a2e; border-color: var(--border2); color: var(--text2); }

  /* Textarea */
  textarea {
    width: 100%; min-height: 220px; background: var(--bg4);
    border: 1px solid var(--border2); border-radius: 4px; padding: 12px;
    color: var(--text); font-size: 12px; font-family: var(--mono);
    outline: none; resize: vertical; line-height: 1.6;
  }
  textarea:focus { border-color: var(--accent); }

  /* PDF drop zone */
  .drop-zone {
    border: 2px dashed var(--border2); border-radius: 8px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    background: var(--bg4); transition: all 0.2s;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: #020d1a; }
  .drop-zone.has-file { border-color: #00d4ff66; background: #020d1a; }
  .drop-icon { font-size: 32px; margin-bottom: 10px; }
  .drop-name { color: var(--accent); font-size: 13px; margin-bottom: 4px; }
  .drop-hint { color: var(--text3); font-size: 11px; font-family: var(--sans); }

  /* Analyze button */
  .btn-analyze {
    margin-top: 14px; background: #0a2040; border: 1px solid #00d4ff66;
    color: var(--accent); border-radius: 4px; padding: 10px 28px;
    cursor: pointer; font-size: 12px; letter-spacing: 2px;
    font-weight: 700; font-family: var(--mono); transition: all 0.2s;
  }
  .btn-analyze:hover { background: #0d2a50; }
  .btn-analyze:disabled { background: #070e1a; border-color: #1a2a3a; color: #2a4a5a; cursor: not-allowed; }

  /* ── Loading ── */
  .loading { text-align: center; padding: 60px; }
  .loading-text { color: var(--accent); font-size: 13px; letter-spacing: 3px; }
  .loading-sub { color: var(--text4); font-size: 11px; margin-top: 8px; font-family: var(--sans); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .loading-text { animation: pulse 1.5s infinite; }

  /* ── Error ── */
  .error-box {
    background: #1a0505; border: 1px solid var(--red);

  .btn-retry {

  /* ── Stats bar ── */
  .stats-bar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .stat-box {

    display: flex; gap: 8px; align-items: center;
  }

  .stat-box.important { background: #1a0d00; border: 1px solid #ff950044; }
  .stat-box.new-box { background: #001030; border: 1px solid #0055cc44; }
  .stat-box.total { background: var(--bg3); border: 1px solid var(--border); }
  .stat-num { font-size: 20px; font-weight: 700; }
  .stat-num.critical { color: var(--red); }
  .stat-num.important { color: var(--orange); }
  .stat-num.new { color: #4d9fff; }
  .stat-num.total { color: var(--text3); }
  .stat-label { font-size: 10px; letter-spacing: 1px; }
  .stat-label.critical { color: #7a2020; }
  .stat-label.important { color: #7a4a00; }
  .stat-label.new { color: #0a3a6a; }
  .stat-label.total { color: var(--text4); }
  .btn-new {
    margin-left: auto; background: transparent; border: 1px solid var(--border2);
    color: var(--text3); border-radius: 4px; padding: 6px 14px;
    cursor: pointer; font-size: 11px; letter-spacing: 1px; font-family: var(--mono);
  }
  .btn-new:hover { background: #0d1a2e; }

  /* ── Filter tabs ── */
  .filter-tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid #0d1a2a; padding-bottom: 8px; }
  .filter-tab {
    background: transparent; border: 1px solid transparent; color: var(--text4);
    border-radius: 4px; padding: 5px 12px; cursor: pointer;
    font-size: 10px; letter-spacing: 1px; font-family: var(--mono);
  }
  .filter-tab.active { background: #0d1a2e; border-color: var(--border2); color: var(--text2); }

  /* ── Results footer ── */

// ── UI helpers ────────────────────────────────────────────────────────────────
function setLoading(on, msg) {
  document.getElementById('inputPanel').classList.toggle('hidden', on);
  document.getElementById('apiPanel').classList.toggle('hidden', on);
  document.getElementById('loading').classList.toggle('hidden', !on);
  document.getElementById('errorBox').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  if (on && msg) document.getElementById('loadingText').textContent = '◈ ' + msg.toUpperCase();
}

function showError(msg) {
  document.getElementById('errorMsg').textContent = '⚠ ' + msg;
  document.getElementById('errorBox').classList.remove('hidden');
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('inputPanel').classList.remove('hidden');
  document.getElementById('apiPanel').classList.remove('hidden');
}

function reset() {
  allNotams = []; expandedIds.clear();
  document.getElementById('errorBox').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('inputPanel').classList.remove('hidden');
  document.getElementById('apiPanel').classList.remove('hidden');
}

function isNew(notam) {
  if (!lastBriefingDate || !notam.created) return false;
  try { return new Date(notam.created) > new Date(lastBriefingDate); } catch { return false; }
}

function priorityOrder(p) { return { CRITICAL:0, IMPORTANT:1, ROUTINE:2 }[p] ?? 2; }

function getFiltered() {
  return allNotams
    .filter(n => {
      if (activeTab === 'critical') return n.priority === 'CRITICAL';
      if (activeTab === 'important') return n.priority === 'IMPORTANT';
      if (activeTab === 'new') return isNew(n);
      return true;
    })
    .sort((a,b) => (priorityOrder(a.priority) - (isNew(a)?0.5:0)) - (priorityOrder(b.priority) - (isNew(b)?0.5:0)));
}

// ── Render results ────────────────────────────────────────────────────────────
function showResults() {
  activeTab = 'all';
  renderStats();
  renderTabs();
  renderList();
  document.getElementById('results').classList.remove('hidden');
}

function renderStats() {
  const critical = allNotams.filter(n => n.priority === 'CRITICAL').length;
  const important = allNotams.filter(n => n.priority === 'IMPORTANT').length;
  const newCount = allNotams.filter(isNew).length;
  let html = '';
  if (critical) html += `<div class="stat-box critical"><span class="stat-num critical">${critical}</span><span class="stat-label critical">CRITICAL</span></div>`;
  if (important) html += `<div class="stat-box important"><span class="stat-num important">${important}</span><span class="stat-label important">IMPORTANT</span></div>`;
  if (newCount) html += `<div class="stat-box new-box"><span class="stat-num new">${newCount}</span><span class="stat-label new">NEW</span></div>`;
  html += `<div class="stat-box total"><span class="stat-num total">${allNotams.length}</span><span class="stat-label total">TOTAL</span></div>`;
  html += `<button class="btn-new" onclick="reset()">NEW BRIEFING</button>`;
  document.getElementById('statsBar').innerHTML = html;
}

function renderTabs() {
  const critical = allNotams.filter(n => n.priority === 'CRITICAL').length;
  const important = allNotams.filter(n => n.priority === 'IMPORTANT').length;
  const newCount = allNotams.filter(isNew).length;
  const tabs = [
    { key:'all', label:`ALL (${allNotams.length})` },
    { key:'critical', label:`CRITICAL (${critical})` },
    { key:'important', label:`IMPORTANT (${important})` },
    { key:'new', label:`🆕 NEW (${newCount})` },
  ];
  document.getElementById('filterTabs').innerHTML = tabs.map(t =>
    `<button class="filter-tab ${activeTab===t.key?'active':''}" onclick="setTab('${t.key}')">${t.label}</button>`
  ).join('');
}

function setTab(tab) {
  activeTab = tab;
  renderTabs();
  renderList();
}

function renderList() {
  const list = getFiltered();
  const el = document.getElementById('notamList');
  if (!list.length) { el.innerHTML = '<div class="empty-state">No NOTAMs in this category.</div>'; return; }
  el.innerHTML = list.map(n => renderCard(n)).join('');
}

function renderCard(n) {
  const k = (n.id || n.raw?.slice(0,20) || Math.random()).toString().replace(/[^a-zA-Z0-9]/g,'_');
  const pClass = (n.priority||'ROUTINE').toLowerCase();
  const newClass = isNew(n) ? 'is-new' : '';
  const expanded = expandedIds.has(k);

  // Priority badge
  const badgeClass = pClass;
  const badge = `<span class="badge ${badgeClass}"><span class="badge-dot"></span>${n.priority||'ROUTINE'}</span>`;

  // Category tag
  const cat = n.category ? `<span class="tag">${n.category.replace('_','/')}</span>` : '';
  const newTag = isNew(n) ? `<span class="tag new-tag">🆕 NEW</span>` : '';
  const airport = n.airport ? `<span class="tag airport">${n.airport}</span>` : '';
  const idTag = n.id ? `<span class="card-id">${n.id}</span>` : '';

  const area = n.coordinateArea ? `<div class="card-area">📍 ${n.coordinateArea}</div>` : '';

  // Mini map
  let mapHtml = '';
  if (expanded && n.coordinates?.length) {
    mapHtml = renderMiniMap(n.coordinates, k);
  }

  // Times
  let times = '';
  if (expanded) {
    times = '<div class="card-times">';
    if (n.validFrom) times += `<div class="card-time">FROM: <span>${n.validFrom}</span></div>`;
    if (n.validTo) times += `<div class="card-time">TO: <span>${n.validTo}</span></div>`;
    if (n.created) times += `<div class="card-time">CREATED: <span>${n.created}</span></div>`;
    times += '</div>';
  }

  const body = expanded ? `
    <div class="card-body">
      ${mapHtml}
      <div class="card-section-label">Raw NOTAM</div>
      <pre class="card-raw">${escHtml(n.raw||'')}</pre>
      ${times}
    </div>` : '';

  return `
    <div class="notam-card ${pClass} ${newClass}" id="card_${k}">
      <div class="card-header" onclick="toggleCard('${k}')">
        <div class="card-meta">
          <div class="card-tags">${badge}${cat}${newTag}${airport}${idTag}</div>
          <div class="card-summary">${escHtml(n.summary||'')}</div>
          ${area}
        </div>
        <div class="card-toggle">${expanded?'▲':'▼'}</div>
      </div>
      ${body}
    </div>`;
}

function toggleCard(k) {
  if (expandedIds.has(k)) expandedIds.delete(k);
  else expandedIds.add(k);
  renderList();
}

function renderMiniMap(coords, k) {
  const lats = coords.map(c=>c.lat), lons = coords.map(c=>c.lon);
  const minLat=Math.min(...lats)-1, maxLat=Math.max(...lats)+1;
  const minLon=Math.min(...lons)-1, maxLon=Math.max(...lons)+1;
  const W=220,H=130,latR=maxLat-minLat||2,lonR=maxLon-minLon||2;
  const toX=lon=>((lon-minLon)/lonR)*(W-24)+12;
  const toY=lat=>H-((lat-minLat)/latR)*(H-24)-12;
  const pts = coords.map((c,i)=>`
    <circle cx="${toX(c.lon)}" cy="${toY(c.lat)}" r="14" fill="#00d4ff" fill-opacity="0.1"/>
    <circle cx="${toX(c.lon)}" cy="${toY(c.lat)}" r="4" fill="#00d4ff"/>
    <circle cx="${toX(c.lon)}" cy="${toY(c.lat)}" r="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="${toX(c.lon)+11}" y="${toY(c.lat)+4}" fill="#7ec8e3" font-size="9" font-family="monospace">${escHtml(c.label||String(i+1))}</text>
  `).join('');
  return `<div class="mini-map-wrap">
    <div class="card-section-label">Area Overview</div>
    <svg class="mini-map-svg" width="${W}" height="${H}">${pts}</svg>
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
